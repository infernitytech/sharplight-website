- id: disk-moe
  title: MoE models larger than memory, experts streamed from disk
  unit: generation speed relative to llama.cpp (1.00)
  higher_is_better: true
  description: Generation speed of three large MoE models on one 32 GB GPU and 62 GB of system memory, same GGUF files on both engines, relative to llama.cpp; the tokens per second are under each model.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB); AMD EPYC 7443 with 10 threads and 62 GB of memory for all processes; NVMe SSD reading 7.4 GB/s.
  versions: Sharplight develop as of 2026-11-22 / 2026-11-23 (log sections 85 and 87; CUDA provider, --cpu-offload --experts-on-disk); llama.cpp b11177 CUDA 13 build (-ngl 99 -fa on -t 10, -ncmoe set so the same expert layers stay on the GPU, the model file memory-mapped).
  methodology: >-
    Greedy generation of up to 24 tokens after the same prompt ("The capital of France is"; llama.cpp's DeepSeek-V3.1 run
    stopped after 15), each engine's own reported generation speed. Sharplight keeps the dense part and a few expert layers on the GPU and reads the other experts from the file
    into a fixed cache (16-28 GiB, O_DIRECT); llama.cpp pages the memory-mapped file in through the operating system's page cache.
  caveats:
    - "Model sizes: DeepSeek-V3.1 Q4_K_M 405 GB, GLM-5.2 UD-Q2_K_XL 254 GB, DeepSeek-V4-Flash UD-IQ1_S 82.5 GB. All three are verified against llama.cpp's output (and GLM-5.2 also against transformers on a truncated checkpoint)."
    - "Mixed: 1.56x on DeepSeek-V3.1, level on DeepSeek-V4-Flash, 0.75x on GLM-5.2, whose first run starts from an empty expert cache."
    - "With a warm expert cache Sharplight's decode steps reach a median of 12.1 tokens/s on DeepSeek-V4-Flash and 0.99 tokens/s on GLM-5.2; llama.cpp has no comparable warm-cache measurement here."
    - The first prompt is faster on llama.cpp for DeepSeek-V4-Flash (5 tokens in 2.0 s against 6.0 s), twice as fast on Sharplight for DeepSeek-V3.1 (8.1 s against 16.4 s for 6 tokens).
  source: "docs/benchmarks.md sections 85.4, 87.2, 87.10"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#854-against-llamacpp-under-the-same-limits
  date: 2026-11-23
  groups:
    - label: DeepSeek-V3.1 Q4_K_M (405 GB)
      results: [{ engine: Sharplight, value: 1.56 }, { engine: llama.cpp CUDA, value: 1.00 }]
      note: "tokens/s: Sharplight 0.97, llama.cpp 0.62"
    - label: GLM-5.2 UD-Q2_K_XL (254 GB)
      results: [{ engine: Sharplight, value: 0.75 }, { engine: llama.cpp CUDA, value: 1.00 }]
      note: "tokens/s: Sharplight 0.41, llama.cpp 0.55"
    - label: DeepSeek-V4-Flash UD-IQ1_S (82.5 GB)
      results: [{ engine: Sharplight, value: 1.01 }, { engine: llama.cpp CUDA, value: 1.00 }]
      note: "tokens/s: Sharplight 7.2, llama.cpp 7.15"

- id: onnx-strict
  title: ONNX latency at f32 accuracy against onnxruntime's CUDA provider
  unit: latency relative to onnxruntime (1.00)
  higher_is_better: false
  description: Inference latency on CUDA with full f32 matrix products on both sides, relative to onnxruntime; the milliseconds are under each case. Lower is better.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), CUDA 13.2.
  versions: Sharplight develop as of 2026-11-23 (CUDA provider; log section 99); onnxruntime-gpu 1.32.0 with the CUDA execution provider (CUDA 13, cuDNN 9.28), TF32 off.
  methodology: >-
    bench/onnx/parity_bench.py on the same ONNX files: every measurement in its own process, engines of one model back to back,
    two interleaved rounds, wall-clock minimum of one run including the read-back of every output, minimum over the rounds.
    Sharplight's default "strict" precision keeps f32 accuracy in matrix products, as onnxruntime does with TF32 off. Outputs are
    checked against onnxruntime's in the same run.
  caveats:
    - Sharplight is faster on every measured row (0.06-0.88x of onnxruntime's time).
    - Minimum latency, the best case for every engine.
    - "efficientnet-lite4: onnxruntime takes 12.2 ms with TF32 off against 1.4 ms with it on, hence the 0.06x."
