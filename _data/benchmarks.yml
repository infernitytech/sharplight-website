- id: moe-offload
  title: MoE models with experts in system memory, against llama.cpp (earlier round, section 107)
  unit: speed relative to llama.cpp (1.00)
  higher_is_better: true
  description: Single-stream generation and 512-token prompt processing of two MoE models larger than the GPU, routed experts partly in system memory, same GGUF files, relative to llama.cpp at its best -ncmoe; the tokens per second are under each case.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit); AMD EPYC 7443 with 10 threads (AVX2) and 62 GB of memory.
  versions: Sharplight develop at 18fe1a1d (log section 107), --cpu-offload with automatic placement; llama.cpp b11177, official CUDA 13 and Vulkan builds, llama-bench -ngl 99 -fa 1 -t 10 with -ncmoe swept and the fastest value used (Qwen3-Coder-Next 16, Qwen3.5-122B-A10B 6).
  methodology: >-
    llama-bench's procedure and statistic on both engines: one warm-up, then 5 identical runs of each test, mean of the per-run
    tokens per second. Prefill: 512 tokens from an empty cache (llama-bench pp512; Sharplight --bench 512 with
    SHARPLIGHT_BENCH_PREFILL_REPEATS=4). Generation: 64 tokens one at a time after an untimed 512-token prompt, from an empty
    cache each run (llama-bench -n 64 -d 512; Sharplight SHARPLIGHT_BENCH_DECODE_RUNS=5). Three rounds per model and backend
    with alternating order; the chart shows the average of the rounds' means for each engine. Both engines read the model
    files from the page cache during the timed runs.
  caveats:
    - "On Vulkan Sharplight generates at 1.43-1.45x of llama.cpp's Vulkan backend and processes prompts at 1.22-1.44x."
    - "On CUDA the two engines are level: generation 0.95x (Qwen3-Coder-Next, llama.cpp ahead) and 1.02x, prompt processing 1.02-1.17x."
    - "Sharplight's generation runs spread more than llama.cpp's (± 2-10 % against ± 1-4 %): the first of the five runs is the slowest, as the CPU / GPU split is re-balanced after each reset. The mean includes it."
    - "Model files: Qwen3-Coder-Next Q4_K_M 48.5 GB, Qwen3.5-122B-A10B UD-IQ2_XXS 36.6 GB."
  source: "docs/benchmarks.md section 107.2; bench/results/same-stat/offload"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#ss2-moe-with-cpu-expert-offload
  date: 2026-11-24
  groups:
    - label: Qwen3-Coder-Next Q4_K_M, generation, Vulkan
      results: [{ engine: Sharplight, value: 1.43 }, { engine: llama.cpp Vulkan, value: 1.00 }]
      note: "tokens/s: Sharplight 85.4, llama.cpp 59.8"
    - label: Qwen3-Coder-Next Q4_K_M, prompt 512, Vulkan
      results: [{ engine: Sharplight, value: 1.44 }, { engine: llama.cpp Vulkan, value: 1.00 }]
      note: "tokens/s: Sharplight 492, llama.cpp 341"
    - label: Qwen3.5-122B-A10B UD-IQ2_XXS, generation, Vulkan
      results: [{ engine: Sharplight, value: 1.45 }, { engine: llama.cpp Vulkan, value: 1.00 }]
