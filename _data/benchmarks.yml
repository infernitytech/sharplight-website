- id: moe-offload-latest
  title: MoE models with experts in system memory, against llama.cpp (latest round)
  unit: speed relative to llama.cpp (1.00)
  higher_is_better: true
  description: Single-stream generation and 512-token prompt processing of three MoE models larger than the GPU, routed experts partly in system memory, same GGUF files, relative to llama.cpp at its best -ncmoe; the tokens per second are under each case.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit); AMD EPYC 7443 with 10 threads (AVX2) and 62 GB of memory; PCIe 4.
  versions: Sharplight develop at 3705851f with the selected-expert copies of log section 111, --cpu-offload with automatic placement; llama.cpp b11177, official CUDA 13 and Vulkan builds, llama-bench -ngl 99 -fa 1 -t 10, -ncmoe 22 (gpt-oss-120b, with -lm none), 16 (Qwen3-Coder-Next), 6 (Qwen3.5-122B-A10B).
  methodology: >-
    llama-bench's procedure and statistic on both engines, as in the earlier round: one warm-up, then 5 identical runs of each
    test, mean of the per-run tokens per second. Prompt: 512 tokens drawn from the whole vocabulary, from an empty cache (pp512).
    Generation: 64 tokens one at a time after an untimed 512-token prompt, from an empty cache each run (tg64 at depth 512). Two
    rounds per model on CUDA (one with each engine first; the chart shows the mean of the rounds), one round on Vulkan.
  caveats:
    - "gpt-oss-120b prompts are behind llama.cpp: 0.85x on CUDA and 0.81x on Vulkan. With all CPU experts page-locked, as llama.cpp's -lm none keeps them, Sharplight reaches 0.96x on CUDA (613 tokens/s)."
    - "Qwen3-Coder-Next generation on CUDA is level by the mean (0.99x): Sharplight's first of the five runs after a reset is slower (75-88 against 95-103 tokens/s for the later runs), the later runs about 5 % ahead."
    - "Qwen3.5-122B-A10B on Vulkan was not repeated in this round; the earlier round (next chart) has it at 1.45x generation and 1.22x prompts."
    - "Model files: gpt-oss-120b MXFP4 63.4 GB, Qwen3-Coder-Next Q4_K_M 48.5 GB, Qwen3.5-122B-A10B UD-IQ2_XXS 36.6 GB."
