- id: serving-throughput
  title: Serving throughput with concurrent streams (Llama-3.2-1B)
  unit: tokens/s
  higher_is_better: true
  home: true
  chart: lines
  description: Total output tokens per second of one server as the number of simultaneous requests grows.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.91, CUDA 13.2; shared machine.
  versions: Sharplight develop at 282dd5b (Vulkan provider); llama.cpp b11177 CUDA 13 llama-server; vLLM 0.33.0.
  methodology: >-
    One server per engine with 64 slots and 512-token contexts. Load generator sends prompts of about 250 random-word
    tokens and reads 128 output tokens at temperature 0; 2 rounds per concurrency, median shown.
  caveats:
    - "The weights differ: Sharplight and llama.cpp ran the Q8_0 GGUF file, vLLM ran the bf16 Hugging Face checkpoint. The vLLM line compares batching engines, not identical work."
    - At 64 streams vLLM is ahead (Sharplight 0.75x of vLLM).
    - Short prompts and short answers; a workload with long prompts stresses prompt processing instead (see the time-to-first-token chart).
    - Two rounds per point on a shared machine.
  source: "docs/benchmarks.md section 34.3 (both tables, rows llama3.2-1b)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md
  date: 2026-11-15
  groups:
    - label: 1 stream
      results: [{ engine: Sharplight, value: 445 }, { engine: llama.cpp CUDA, value: 408 }, { engine: vLLM (bf16 weights), value: 271 }]
    - label: 4 streams
      results: [{ engine: Sharplight, value: 1539 }, { engine: llama.cpp CUDA, value: 678 }, { engine: vLLM (bf16 weights), value: 1042 }]
    - label: 16 streams
      results: [{ engine: Sharplight, value: 4069 }, { engine: llama.cpp CUDA, value: 1034 }, { engine: vLLM (bf16 weights), value: 3634 }]
    - label: 64 streams
      results: [{ engine: Sharplight, value: 6137 }, { engine: llama.cpp CUDA, value: 1397 }, { engine: vLLM (bf16 weights), value: 8192 }]

