    - label: Llama-3.2-1B Q8_0
      results: [{ engine: Sharplight, value: 41092 }, { engine: llama.cpp CUDA, value: 41426 }]
    - label: Gemma-3-1B Q8_0
      results: [{ engine: Sharplight, value: 42946 }, { engine: llama.cpp CUDA, value: 37857 }]
    - label: OLMoE-1B-7B Q4_K_M
      results: [{ engine: Sharplight, value: 21422 }, { engine: llama.cpp CUDA, value: 20236 }]
    - label: Mistral-7B Q4_K_M
      results: [{ engine: Sharplight, value: 7393 }, { engine: llama.cpp CUDA, value: 7129 }]
    - label: Qwen3-8B Q4_K_M
      results: [{ engine: Sharplight, value: 7023 }, { engine: llama.cpp CUDA, value: 7059 }]
