- id: nvfp4-vllm
  title: NVFP4 (4-bit) checkpoints served against vLLM
  unit: tokens/s
  higher_is_better: true
  description: Total output tokens per second of one server at 1, 16 and 64 simultaneous requests, the same NVFP4 Hugging Face checkpoints and a 16-bit KV cache on both engines.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.112, CUDA 13.2.
  versions: Sharplight develop at 18fe1a1d with the native FP4 products of log section 106 (CUDA provider); vLLM 0.33.0 with --linear-backend cutlass (and --moe-backend cutlass for the MoE), --gpu-memory-utilization 0.6 (0.85 for the MoE).
  methodology: >-
    As the serving chart against vLLM: one server per engine with 1, 16 or 64 slots of 512 tokens, the same load generator in a
    closed loop, prompts of about 250 random-word tokens, 128 output tokens, temperature 0. Two rounds per point; the chart
    shows the mean of the two rounds. Both engines quantize activations to FP4 at run time (W4A4).
  caveats:
    - "Sharplight is ahead with one request (1.07x dense, 1.58x MoE), level at 16 (0.97x, 1.01x) and behind at 64 (0.85x, 0.82x)."
    - "vLLM's default FP4 kernels (FlashInfer) are compiled on first use and their build failed on this machine, so vLLM ran its own precompiled CUTLASS FP4 kernels."
    - "Checkpoints: RedHatAI/Qwen3-8B-NVFP4 and RedHatAI/Qwen3-30B-A3B-NVFP4 (compressed-tensors). The NVIDIA ModelOpt checkpoint is left out: vLLM serves it with an FP8 KV cache and Sharplight with f16, which is not like-for-like."
    - "Accuracy: wikitext-2 perplexity on the dense checkpoint 9.09 (Sharplight) against 8.98 (vLLM), which uses the checkpoint's calibrated activation scales (section 106.4)."
  source: "docs/benchmarks.md section 106.6"
