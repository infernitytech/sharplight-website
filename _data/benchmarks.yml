- id: seedvr2-pytorch
  title: SeedVR2 3B video restoration against the official PyTorch inference
  unit: seconds, end to end
  higher_is_better: false
  description: Time to restore and upscale a 33-frame clip 2x (read the video, encode, diffusion transformer, decode, write the video), the same official checkpoint on both. Lower is better.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.112, CUDA 13.2.
  versions: Sharplight develop at 22be85fe with the channels-last f16 convolutions of log section 110 (CUDA and Vulkan providers, reduced precision); the official ByteDance-Seed/SeedVR inference code (projects/video_diffusion_sr/infer.py) on PyTorch 2.14 (CUDA 13.0), bf16 autocast and flash attention.
  methodology: >-
    The same checkpoint (seedvr2_ema_3b.pth, ema_vae.pth), the same 30 fps clip, 33 frames in one batch, 2x upscaling with the
    wavelet colour fix, seed 42. Median of 5 runs after one warm-up on both sides. PyTorch in its fastest setting that fits
    (DiT and VAE resident at 480p; at 720p the official offloading with the DiT weights in bf16, as the other settings run out of
    memory). Sharplight's section-110 runs did not write the output video, so its video-writing time from section 108
    (0.44 s at 480p, 0.96 s at 720p) is added; PyTorch's times include writing.
  caveats:
    - "Sharplight takes 0.88x of PyTorch's time at 480p and 0.70x at 720p. Vulkan is within 2 % of CUDA."
    - "At 832 x 480 -> 1664 x 960 the official script runs out of memory in all three settings; Sharplight takes 72.2 s on CUDA (73.4 s on Vulkan) with the earlier build of section 108, before the convolution change. 1920 x 1088 output runs out of memory on both."
    - "Output agrees with PyTorch's: worst frame 48.9 dB PSNR, mean 49.4-49.5 dB on CUDA and Vulkan (17 frames, the same input frames and noise)."
    - "Peak memory (section 108 build): 23.1 against 31.1 GiB at 480p, 21.7 against 30.6 GiB at 720p."
    - "Not repeated with the current build: the 7B model and 65-frame clips, where Sharplight was 1.35x and 1.59x of PyTorch's time before the convolution change (section 108)."
  source: "docs/benchmarks.md sections 110.4 and 108.1"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#1104-end-to-end
  date: 2026-11-24
  groups:
    - label: 416 x 240 -> 832 x 480
