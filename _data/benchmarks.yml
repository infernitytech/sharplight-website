# Benchmark charts for /benchmarks/technical/ (and one chart on the home page). The simple charts of the overview page
# (/benchmarks/) are in _data/benchmark_overview.yml.
# Every number is copied from docs/benchmarks.md in the engine repository or computed from the raw files under
# bench/results/ it cites; `source` names the section, table or file.
#
# Schema (the implementation's schema, plus optional fields marked +):
# - id: unique slug (also the anchor on /benchmarks/technical/)
#   title: chart title
#   unit: "tokens/s"
#   higher_is_better: true
#   description: one sentence
#   hardware: "..."
#   versions: "..."
#   methodology: "..."
#   caveats: ["...", "..."]
# + source: section and table of docs/benchmarks.md
# + source_url: link to the file on GitHub
# + date: measurement date
# + chart: "bars" (default) | "lines" (x = group label, one line per engine)
# + home: true for the chart shown on the home page
#   groups:                       # one bar cluster per group (model, scenario)
#     - label: "..."
#       results:
#         - { engine: Sharplight, value: 100 }
#       + note: per-group remark
#
# Engines are named exactly as they should appear in legends. Do not reorder groups or drop the rows where
# Sharplight is behind: they are part of the page's argument.

- id: serving-vllm
  title: Serving throughput against vLLM on identical weights
  unit: tokens/s
  higher_is_better: true
  description: Total output tokens per second of one server with 16 and 64 simultaneous requests, same Hugging Face checkpoints on both engines.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), CUDA 13.2.
  versions: Sharplight develop at 18fe1a1d (CUDA provider); vLLM 0.33.0 (default settings, prefix caching off, --gpu-memory-utilization 0.6).
  methodology: >-
    One server per engine and model with 16 or 64 slots of 512 tokens (Sharplight serve --slots, vLLM --max-num-seqs and
    --max-model-len 512). The same load generator (bench/loadgen.py) in a closed loop: every worker keeps one request in flight,
    prompts of about 250 random-word tokens, exactly 128 output tokens (ignore_eos), temperature 0, 64 requests per run. One run per
    engine in the same session; Sharplight ran once before and once after vLLM and the chart shows the run before (the other is
    within 0.3 % on throughput). After every run a batched text check compares concurrent greedy answers with single-request ones.
  caveats:
    - "Parity: 0.99-1.03x of vLLM. Differences of this size are within run-to-run variation."
    - Checkpoints are Qwen/Qwen3-8B-FP8 (block-scaled FP8), openai/gpt-oss-20b (MXFP4 experts, bf16 rest) and meta-llama/Llama-3.1-8B-Instruct (bf16).
    - Every Sharplight run passed the batched text check; vLLM's gpt-oss-20b run flagged one of 64 batched answers.
  source: "docs/benchmarks.md section 104.3"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#1043-serving-develop-against-r44-against-vllm-with-the-text-check
  date: 2026-11-24
  groups:
    - label: Qwen3-8B FP8, 16 streams
      results: [{ engine: Sharplight, value: 1109 }, { engine: vLLM, value: 1115 }]
    - label: Qwen3-8B FP8, 64 streams
      results: [{ engine: Sharplight, value: 2742 }, { engine: vLLM, value: 2692 }]
    - label: gpt-oss-20b, 16 streams
      results: [{ engine: Sharplight, value: 1439 }, { engine: vLLM, value: 1402 }]
    - label: gpt-oss-20b, 64 streams
      results: [{ engine: Sharplight, value: 3228 }, { engine: vLLM, value: 3140 }]
    - label: Llama-3.1-8B bf16, 16 streams
      results: [{ engine: Sharplight, value: 671 }, { engine: vLLM, value: 676 }]
    - label: Llama-3.1-8B bf16, 64 streams
      results: [{ engine: Sharplight, value: 1737 }, { engine: vLLM, value: 1713 }]

- id: ttft-vllm
  title: Time to first token against vLLM under load
  unit: ms
  higher_is_better: false
  home: true
  description: Median time until the first output token with 16 and 64 simultaneous requests, same Hugging Face checkpoints on both engines. Lower is better.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), CUDA 13.2.
  versions: Sharplight develop at 18fe1a1d (CUDA provider); vLLM 0.33.0 (default settings, prefix caching off).
  methodology: >-
    Taken from the serving-throughput runs against vLLM (one server per engine, 16 or 64 slots of 512 tokens, closed loop, ~250-token
    prompts, 128 output tokens): same load generator and statistic (TTFT p50 over the 64 requests of a run) on both engines. Sharplight's second run is within 5 ms of the values shown.
  caveats:
    - At 16 streams Sharplight's first token arrives in 0.44-0.55x of vLLM's time, at 64 streams in 0.64-0.70x.
    - "The trade-off is in the tail at 16 streams: Sharplight's p99 inter-token latency is 48-85 ms against vLLM's 21-28 ms, and its mean inter-token latency is 2-5 % higher. At 64 streams the p99 is level (116-224 against 120-232 ms) and the mean 1-3 % higher."
    - "For one request alone on a fresh server: 26 against 47 ms (Qwen3-8B FP8), 29 against 37 ms (gpt-oss-20b), 44 against 47 ms (Llama-3.1-8B)."
  source: "docs/benchmarks.md section 104.3"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#1043-serving-develop-against-r44-against-vllm-with-the-text-check
