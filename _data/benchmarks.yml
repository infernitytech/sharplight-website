- id: onnx-fast
  title: ONNX latency at TF32-class precision against onnxruntime and TensorRT
  unit: latency relative to onnxruntime (1.00)
  higher_is_better: false
  description: The same models with reduced-precision matrix products on all three engines, relative to onnxruntime's CUDA provider at its default. Lower is better.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), CUDA 13.2.
  versions: Sharplight develop as of 2026-11-23 (CUDA provider; log section 99); onnxruntime-gpu 1.32.0, CUDA execution provider with TF32 on (its default) and TensorRT 10.16 execution provider (f32 engines with TF32 tactics, engine build time excluded).
  methodology: >-
    As the f32 chart. Sharplight's opt-in "fast" precision multiplies 11-significant-bit inputs (the significand of TF32) with
    f32 range and f32 accumulation, the precision class of TF32. TensorRT ran on the same machine on the same day in a separate
    session; it does not build the quantized language-model graphs and the R-CNNs.
  caveats:
    - Against onnxruntime Sharplight is faster on every row (0.37-0.87x).
    - "TensorRT is ahead on convnext-tiny (1.11x and 1.22x of TensorRT's time), mobilesam (1.23x), yolov10n (1.15x), ssd-10 (1.13x), segformer-b0 at batch 1 (1.12x) and resnet50 at batch 8 (1.08x); level on mobilenetv2 and yolov8n; Sharplight is faster on the other nine rows TensorRT builds."
    - Minimum latency, the best case for every engine.
  source: "docs/benchmarks.md section 99.5 (TensorRT: section 98.3)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#995-onnx-on-cuda-against-onnxruntime-and-tensorrt
