- id: vllm-prefill
  title: Prompt processing against vLLM on identical weights (2048-token prompt)
  unit: tokens/s
  higher_is_better: true
  description: Both engines load the same Hugging Face checkpoints and process a 2048-token prompt in one pass.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.91, CUDA 13.2; no other process on the GPU during the runs.
  versions: Sharplight branch perf/llm-r4 on develop at 31717994 (Vulkan provider); vLLM 0.33.0 (flash-attn backend, CUDA graphs, prefix caching off).
  methodology: >-
    Sharplight --bench, best of 2 process runs x 4 prefills. vLLM bench/vllm_single.py, median of 5. bf16 weights, and
    FP8 (E4M3) for the FP8 checkpoint.
  caveats:
    - vLLM is ahead on three of four models here (Sharplight 0.73-0.92x), level on Qwen3-0.6B (1.01x).
    - At 8192 tokens Sharplight is at 0.73-0.90x of vLLM on all four; at 512 tokens it ranges from 0.75x (Qwen3-8B-FP8) to 1.79x (Qwen3-0.6B).
    - Sharplight's value is a best-of, vLLM's is a median.
  source: "docs/benchmarks.md section 39.2 (rows pp2048, columns Sharplight after and vLLM)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md
  date: 2026-11-17
  groups:
    - label: Qwen3-0.6B bf16
      results: [{ engine: Sharplight, value: 82870 }, { engine: vLLM, value: 82156 }]
    - label: Llama-3.2-1B bf16
      results: [{ engine: Sharplight, value: 48626 }, { engine: vLLM, value: 53097 }]
    - label: Qwen3-8B bf16
      results: [{ engine: Sharplight, value: 7101 }, { engine: vLLM, value: 8729 }]
    - label: Qwen3-8B FP8
      results: [{ engine: Sharplight, value: 10958 }, { engine: vLLM, value: 14967 }]

