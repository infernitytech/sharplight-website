- id: serving-vllm-256
  title: Serving throughput against vLLM at 64-256 streams, mixed request lengths
  unit: tokens/s
  higher_is_better: true
  description: Output tokens per second of one server sized for 256 sequences while every stream still has a request (steady window), log-normal prompt and answer lengths, same Hugging Face checkpoints and the same KV-cache size on both engines.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), CUDA 13.2.
  versions: Sharplight develop at 18fe1a1d (CUDA provider; log section 105); vLLM 0.33.0 (--gpu-memory-utilization 0.9, --max-num-seqs 256, --max-num-batched-tokens 2048, --max-model-len 2560, prefix caching off).
  methodology: >-
    One server per engine and model: 256 sequences, 2,560-token context, a 2,048-row step budget on both; Sharplight's KV cache
    set to vLLM's number of KV tokens (--kv-tokens). The same load generator (bench/loadgen.py --length-mix) sends the same
    requests to both engines in a closed loop at 64, 128 and 256 streams: prompt and answer lengths log-normal with medians of
    200 and 150 tokens (means about 300 and 205), 8 requests per stream, temperature 0. The statistic is the steady-window
    throughput (output tokens until the first stream has no request left) on both engines. One round per engine and load.
  caveats:
    - "At 256 streams Sharplight is 1.22x of vLLM on Qwen3-8B FP8, 1.04x on gpt-oss-20b and 1.15x on Llama-3.1-8B; at 64-128 streams 0.92-1.13x."
    - "One round per point. In repeated runs of the same build this closed-loop mix moved by 10-25 % between rounds on gpt-oss-20b and Llama-3.1-8B (Qwen3-8B FP8 within 0.2 %), so read those two as parity."
    - "With equal prompt and answer lengths (about 250 + 128 tokens) the steady throughput at 128-256 streams is 0.97-1.05x of vLLM."
    - "Llama-3.1-8B at 256 streams is limited by KV-cache memory on both engines: vLLM admits and preempts (566 preemptions), Sharplight queues requests instead, so its median time to first token is longer there (4.0 s against 2.1 s)."
    - "With requests arriving at random (Poisson, about 85 % of saturation) Sharplight's median time to first token is 0.43-0.65x of vLLM's at the same or higher throughput (section 105.6)."
  source: "docs/benchmarks.md sections 105.2 and 105.6"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#1052-saturation-closed-loop-fixed-and-mixed-lengths
