- id: batched-decode-cuda
  title: Batched generation against llama.cpp, CUDA
  unit: tokens/s
  higher_is_better: true
  description: Output tokens per second when 1 to 64 sequences decode together, same Q4_K_M GGUF files, Sharplight's CUDA provider against llama.cpp's CUDA backend, mean step time on both sides.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), CUDA 13.2.
  versions: Sharplight develop at 18fe1a1d (CUDA provider; log section 107); llama.cpp b11177, official CUDA 13 build, llama-batched-bench -ngl 99 -fa 1.
  methodology: >-
    The same procedure and statistic on both engines: per batch size a warm-up pass and a timed pass, each from a cleared cache
    with every sequence prefilled to 256 tokens, then 64 decode steps of all sequences (context depth 256-319). The value is
    sequences x 1000 / the mean step time of the 64 timed steps. Every step computes the logits of every sequence and copies
    them to the host without sampling: llama.cpp's llama-batched-bench (-npp 256 -ntg 64, the second pass of each size), and
    Sharplight's BatchBench in its "download" mode (--depth 256 --warmup 64 --reps 64 --refill). Two rounds per model, one with
    each engine first; the chart shows the average of the two rounds' means.
  caveats:
    - "Sharplight is 1.15-1.22x of llama.cpp on Qwen3-8B and 1.62-1.96x on Qwen3.8-27B at 16-64 sequences, 1.09x on Gemma 4 31B at 16 sequences; single sequences 0.98-1.05x, level."
    - "Sharplight's serving path picks the next token on the GPU and downloads only token ids (its greedy mode), which llama-batched-bench does not do; that mode runs 1.32-1.34x of llama.cpp on Qwen3-8B and 1.68-2.05x on Qwen3.8-27B at 16-64 sequences. The chart shows the like-for-like mode."
    - Gemma 4 31B at 32 or more sequences does not fit next to the weights on this 32 GB card for either engine.
  source: "docs/benchmarks.md section 107.1; bench/results/same-stat/batched"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md#ss1-batched-decode-dense-gguf-q4_k_m-all-layers-on-the-gpu
  date: 2026-11-24
