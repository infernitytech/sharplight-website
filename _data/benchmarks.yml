# Benchmark charts for /benchmarks/ (and one chart on the home page).
# Every number is copied from docs/benchmarks.md in the engine repository; `source` names the section and table.
#
# Schema (the implementation's schema, plus optional fields marked +):
# - id: unique slug (also the anchor on /benchmarks/)
#   title: chart title
#   unit: "tokens/s"
#   higher_is_better: true
#   description: one sentence
#   hardware: "..."
#   versions: "..."
#   methodology: "..."
#   caveats: ["...", "..."]
# + source: section and table of docs/benchmarks.md
# + source_url: link to the file on GitHub
# + date: measurement date
# + chart: "bars" (default) | "lines" (x = group label, one line per engine)
# + home: true for the chart shown on the home page
#   groups:                       # one bar cluster per group (model, scenario)
#     - label: "..."
#       results:
#         - { engine: Sharplight, value: 100 }
#       + note: per-group remark
#
# Engines are named exactly as they should appear in legends. Do not reorder groups or drop the rows where
# Sharplight is behind: they are part of the page's argument.

- id: decode-llamacpp
  title: Single-stream generation speed against llama.cpp
  unit: tokens/s
  higher_is_better: true
  description: Tokens generated per second by one stream on the same GGUF files, right after the prompt.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.91, CUDA 13.2.
  versions: Sharplight develop at 282dd5b (Vulkan provider); llama.cpp b11177, official CUDA 13 and Vulkan builds, -ngl 99 -fa 1.
  methodology: >-
    Sharplight --bench, 3 process runs, median decode step. llama-bench -r 5. Values are medians; 128 generated tokens at
    context depth 0 ("tg128 @d0").
  caveats:
    - Sharplight is 0.88-0.99x of llama.cpp CUDA on every model here, and 0.99-1.09x of llama.cpp Vulkan.
    - A later round (section 36) moved Qwen3-0.6B to 540 and Llama-3.2-1B to 478 tokens/s; this chart keeps one consistent run for all models.
    - One GPU model. Results on other hardware will differ.
  source: "docs/benchmarks.md section 34.2 (rows tg128 @d0)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md
  date: 2026-11-15
  groups:
    - label: Qwen3-0.6B Q8_0
      results: [{ engine: Sharplight, value: 596 }, { engine: llama.cpp CUDA, value: 678 }, { engine: llama.cpp Vulkan, value: 576 }]
    - label: Llama-3.2-1B Q8_0
      results: [{ engine: Sharplight, value: 460 }, { engine: llama.cpp CUDA, value: 484 }, { engine: llama.cpp Vulkan, value: 460 }]
    - label: Gemma-3-1B Q8_0
      results: [{ engine: Sharplight, value: 394 }, { engine: llama.cpp CUDA, value: 406 }, { engine: llama.cpp Vulkan, value: 374 }]
    - label: OLMoE-1B-7B Q4_K_M
      results: [{ engine: Sharplight, value: 620 }, { engine: llama.cpp CUDA, value: 648 }, { engine: llama.cpp Vulkan, value: 573 }]
    - label: Mistral-7B Q4_K_M
      results: [{ engine: Sharplight, value: 155 }, { engine: llama.cpp CUDA, value: 158 }, { engine: llama.cpp Vulkan, value: 153 }]
    - label: Qwen3-8B Q4_K_M
      results: [{ engine: Sharplight, value: 137 }, { engine: llama.cpp CUDA, value: 144 }, { engine: llama.cpp Vulkan, value: 133 }]
    - label: gpt-oss-20b MXFP4
      results: [{ engine: Sharplight, value: 222 }, { engine: llama.cpp CUDA, value: 227 }, { engine: llama.cpp Vulkan, value: 220 }]
    - label: Nemotron-3-Nano-30B Q4_K_M
      results: [{ engine: Sharplight, value: 219 }, { engine: llama.cpp CUDA, value: 230 }, { engine: llama.cpp Vulkan, value: 201 }]
    - label: Qwen3.8-27B Q8_0
      results: [{ engine: Sharplight, value: 27.3 }, { engine: llama.cpp CUDA, value: 27.6 }, { engine: llama.cpp Vulkan, value: 27.5 }]

- id: serving-throughput
  title: Serving throughput with concurrent streams (Llama-3.2-1B)
  unit: tokens/s
  higher_is_better: true
  home: true
  chart: lines
  description: Total output tokens per second of one server as the number of simultaneous requests grows.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.91, CUDA 13.2.
  versions: Sharplight develop at 282dd5b (Vulkan provider); llama.cpp b11177 CUDA 13 llama-server.
  methodology: >-
    Both engines serve the same Q8_0 GGUF file. One server per engine with 64 slots and 512-token contexts. Load generator sends prompts of about 250 random-word
    tokens and reads 128 output tokens at temperature 0; 2 rounds per concurrency, median shown.
  caveats:
    - Short prompts and short answers; a workload with long prompts stresses prompt processing instead (see the time-to-first-token chart).
  source: "docs/benchmarks.md section 34.3 (both tables, rows llama3.2-1b)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md
  date: 2026-11-15
  groups:
    - label: 1 stream
      results: [{ engine: Sharplight, value: 445 }, { engine: llama.cpp CUDA, value: 408 }]
    - label: 4 streams
      results: [{ engine: Sharplight, value: 1539 }, { engine: llama.cpp CUDA, value: 678 }]
    - label: 16 streams
      results: [{ engine: Sharplight, value: 4069 }, { engine: llama.cpp CUDA, value: 1034 }]
    - label: 64 streams
      results: [{ engine: Sharplight, value: 6137 }, { engine: llama.cpp CUDA, value: 1397 }]

