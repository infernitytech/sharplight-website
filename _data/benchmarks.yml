- id: vllm-ttft
  title: Time to first token against vLLM, 16 concurrent streams
  unit: ms
  higher_is_better: false
  description: Median time until the first output token for 2000-token prompts with 16 requests at once. Lower is better.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.91, CUDA 13.2; no other process on the GPU during the runs.
  versions: Sharplight branch perf/llm-r4 on develop at 31717994 (Vulkan provider); vLLM 0.33.0.
  methodology: >-
    One server per engine and model with 16 slots and a 4096-token context. Load generator with 2000-token random-word
    prompts, 16 output tokens, 3 requests per worker, 2 rounds; median of the rounds.
  caveats:
    - "Mixed result: Sharplight's first token arrives sooner on the two small models and later on the two 8B models."
    - "In the same test vLLM's total throughput is higher on all four models (Sharplight 0.68-0.78x), because its prompt processing is faster."
    - The engine log notes that the Qwen3-0.6B value comes from one pair of rounds that was not re-measured.
  source: "docs/benchmarks.md section 39.3 (rows with 16 streams)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md
  date: 2026-11-17
  groups:
    - label: Qwen3-0.6B bf16
      results: [{ engine: Sharplight, value: 116 }, { engine: vLLM, value: 128 }]
    - label: Llama-3.2-1B bf16
      results: [{ engine: Sharplight, value: 158 }, { engine: vLLM, value: 204 }]
    - label: Qwen3-8B bf16
      results: [{ engine: Sharplight, value: 795 }, { engine: vLLM, value: 726 }]
    - label: Qwen3-8B FP8
      results: [{ engine: Sharplight, value: 534 }, { engine: vLLM, value: 493 }]

- id: onnx-latency
  title: ONNX model latency against onnxruntime and TensorRT (batch 1)
  unit: ms
  higher_is_better: false
  description: Minimum wall-clock latency of one inference at batch size 1. Lower is better.
  hardware: One NVIDIA RTX PRO 4500 Blackwell (32 GB, 200 W power limit), driver 595.91, CUDA 13.2.
  versions: Sharplight develop, 2026-11-15 (Vulkan provider); onnxruntime-gpu 1.32 with the CUDA execution provider (TF32 on, its default) and the TensorRT execution provider (engine build time excluded).
  methodology: >-
    Minimum over rounds of each process's minimum of N runs. "Sharplight (fast)" is the opt-in reduced matrix precision
    mode, comparable to onnxruntime's default TF32; "Sharplight (strict)" is the default, f32-accurate mode.
  caveats:
    - Minimum latency, not mean or percentile; it shows the best case for every engine.
    - Like for like is fast against "onnxruntime CUDA" (both TF32 class), and strict against onnxruntime with TF32 off (not charted; Sharplight strict is ahead on every row but phi-3.5, see the source table).
    - TensorRT is ahead on ConvNeXt-tiny, YOLOv10n and MobileSAM here, and on several batch-8 rows in the source table.
    - On phi-3.5-mini Sharplight is slightly behind onnxruntime CUDA (4.71 against 4.54 ms).
    - TensorRT was not measured for the two language-model rows.
  source: "docs/benchmarks.md section 37.2 (batch 1 rows; SL strict and SL fast after values)"
  source_url: https://github.com/infernitytech/sharplight/blob/main/docs/benchmarks.md
  date: 2026-11-15
  groups:
    - label: resnet50
      results: [{ engine: Sharplight (fast), value: 0.53 }, { engine: Sharplight (strict), value: 0.71 }, { engine: onnxruntime CUDA, value: 1.18 }, { engine: TensorRT, value: 1.06 }]
    - label: convnext-tiny
      results: [{ engine: Sharplight (fast), value: 0.99 }, { engine: Sharplight (strict), value: 1.39 }, { engine: onnxruntime CUDA, value: 1.47 }, { engine: TensorRT, value: 0.72 }]
    - label: yolov10n
      results: [{ engine: Sharplight (fast), value: 0.82 }, { engine: Sharplight (strict), value: 0.98 }, { engine: onnxruntime CUDA, value: 1.72 }, { engine: TensorRT, value: 0.72 }]
    - label: bert-base (16 tokens)
      results: [{ engine: Sharplight (fast), value: 0.96 }, { engine: Sharplight (strict), value: 1.33 }, { engine: onnxruntime CUDA, value: 1.87 }, { engine: TensorRT, value: 1.20 }]
    - label: vit-base
      results: [{ engine: Sharplight (fast), value: 1.42 }, { engine: Sharplight (strict), value: 2.76 }, { engine: onnxruntime CUDA, value: 1.61 }, { engine: TensorRT, value: 2.26 }]
    - label: whisper-tiny encoder
      results: [{ engine: Sharplight (fast), value: 1.25 }, { engine: Sharplight (strict), value: 1.95 }, { engine: onnxruntime CUDA, value: 1.89 }, { engine: TensorRT, value: 1.56 }]
    - label: mobilesam encoder
      results: [{ engine: Sharplight (fast), value: 5.99 }, { engine: Sharplight (strict), value: 7.55 }, { engine: onnxruntime CUDA, value: 9.64 }, { engine: TensorRT, value: 4.55 }]
    - label: phi-3.5-mini q4f16 (decode step)
      results: [{ engine: Sharplight (fast), value: 4.71 }, { engine: Sharplight (strict), value: 4.70 }, { engine: onnxruntime CUDA, value: 4.54 }]
    - label: qwen2.5-0.5b q4 (decode step)
      results: [{ engine: Sharplight (fast), value: 3.48 }, { engine: Sharplight (strict), value: 3.49 }, { engine: onnxruntime CUDA, value: 6.03 }]
